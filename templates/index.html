<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Stock Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #0f172a, #1e293b);
      min-height: 100vh;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .card-3d {
      transition: 0.3s ease;
    }
    .card-3d:hover {
      transform: translateY(-8px) scale(1.02);
    }
  </style>
</head>

<body class="flex flex-col items-center justify-center p-6">

  <h1 class="text-4xl font-bold text-cyan-300 drop-shadow-lg mb-4">🧠 AI Stock NLP Analyzer</h1>

  <div class="glass card-3d rounded-2xl p-6 w-full max-w-2xl">
    <div id="chatlog" class="h-80 overflow-y-auto bg-slate-900/50 rounded-xl p-4 mb-4 border border-slate-700"></div>

    <div class="flex items-center space-x-3">
      <input id="input" type="text" 
             placeholder="Enter news or tweet..."
             class="flex-grow bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-cyan-400">
      <button id="send" class="bg-cyan-500 hover:bg-cyan-400 px-6 py-2 rounded-lg font-semibold shadow-lg">Analyze</button>
    </div>
  </div>

  <button onclick="window.location.href='/sentiment'"
          class="mt-6 bg-emerald-500 hover:bg-emerald-400 px-8 py-3 rounded-xl font-semibold shadow-lg hover:scale-105 transition">
    📊 Open Sentiment Dashboard
  </button>

  <script>
    const chatlog = document.getElementById("chatlog");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function appendMessage(sender, text, color="text-cyan-300") {
      const div = document.createElement("div");
      div.classList.add("mb-3", "p-3", "rounded-lg", "bg-slate-800/60", "border", "border-slate-700");
      div.innerHTML = `<b class="${color}">${sender}:</b><br><span class="text-gray-300">${text}</span>`;
      chatlog.appendChild(div);
      chatlog.scrollTop = chatlog.scrollHeight;
    }

    async function analyzeText() {
      const msg = input.value.trim();
      if (!msg) return;
      appendMessage("You", msg);
      input.value = "";

      const res = await fetch("/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: msg})
      });
      const data = await res.json();

      const formatted = `
        📈 <b>Sentiment:</b> ${data.sentiment} (${data.sentiment_score})
        <br>🏢 <b>Entities:</b> ${data.entities.join(", ") || "None"}
        <br>🎯 <b>Matched Stocks:</b> ${data.matched_stocks.join(", ") || "None"}
      `;
      appendMessage("AI", formatted, "text-emerald-300");
    }

    send.addEventListener("click", analyzeText);
    input.addEventListener("keypress", e => e.key === "Enter" && analyzeText());
  </script>
</body>
</html>
